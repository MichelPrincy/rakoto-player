plugins { id 'com.android.application' }
android {
    namespace 'com.rakotoplayer.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rakotoplayer.android'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0.0-beta.2'
        testInstrumentationRunner 'com.rakotoplayer.android.PlayerInstrumentation'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('RAKOTO_KEYSTORE_FILE') ?: '../signing/rakoto-release.p12')
            storePassword System.getenv('RAKOTO_KEYSTORE_PASSWORD')
            keyAlias 'rakoto'
            keyPassword System.getenv('RAKOTO_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        debug { ndk { abiFilters 'x86_64', 'arm64-v8a', 'armeabi-v7a' } }
        release {
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    lint { abortOnError true; checkReleaseBuilds true }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies { implementation 'org.videolan.android:libvlc-all:3.7.7' }

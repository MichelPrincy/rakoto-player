<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commandes vidéo RAKOTO</title><link rel="stylesheet" href="/media-windows.css"><script src="/overlay.js" defer></script></head>
<body class="overlay">
<main id="surface" aria-label="Vidéo RAKOTO">
  <button id="back" class="stage-action" title="Retour à la bibliothèque" aria-label="Retour à la bibliothèque">‹ Bibliothèque</button>
  <div class="glass" id="glass" aria-label="Commandes vidéo">
    <div class="progress-row"><span id="elapsed">0:00</span><div id="timeline"><input type="range" id="seek" min="0" max="1" step=".01" value="0" aria-label="Position"><div id="marks"></div><output id="hover-time" hidden></output></div><span id="duration">0:00</span></div>
    <div class="button-row">
      <div class="left">
        <button data-command="previous" title="Précédent" aria-label="Précédent">⏮</button>
        <button id="play" data-command="toggle" class="play" title="Lire ou mettre en pause" aria-label="Lire">▶</button>
        <button data-command="next" title="Suivant" aria-label="Suivant">⏭</button>
      </div>
      <div class="right">
        <label class="volume"><span aria-hidden="true">◖</span><input type="range" id="volume" min="0" max="1" step=".01" aria-label="Volume"></label>
        <button id="audio" data-menu="audio" title="Pistes audio">Audio</button>
        <button id="subtitle" data-menu="subtitle" title="Sous-titres">CC</button>
        <button id="speed" data-menu="speed" title="Vitesse de lecture">1×</button>
        <button data-menu="video" title="Réglages vidéo" aria-label="Réglages vidéo">⚙</button>
        <button id="float" data-command="video" title="Vidéo flottante" aria-label="Vidéo flottante">▣</button>
        <button id="full" data-command="fullscreen" title="Plein écran" aria-label="Plein écran">⛶</button>
      </div>
    </div>
  </div>
</main>
</body></html>
